name: Airflow CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run dependency-free tests
        run: make test
      - name: Build Airflow image
        run: docker build -t northwind-workflow-automation .
      - name: Verify Compose configuration
        run: docker compose config --quiet

